steps:
  # コンテナイメージのビルド
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--build-arg', 'NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}',
      '--build-arg', 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}',
      '--build-arg', 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}',
      '--build-arg', 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}',
      '--build-arg', 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}',
      '--build-arg', 'NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}',
      '--build-arg', 'NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID}',
      '-t', 'asia-northeast1-docker.pkg.dev/${PROJECT_ID}/household-app-repo/household-app:${SHORT_SHA}',
      '.'
    ]

  # Artifact Registry にイメージをプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-northeast1-docker.pkg.dev/${PROJECT_ID}/household-app-repo/household-app:${SHORT_SHA}']

  # Cloud Run にデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'household-app',
      '--image', 'asia-northeast1-docker.pkg.dev/${PROJECT_ID}/household-app-repo/household-app:${SHORT_SHA}',
      '--region', 'asia-northeast1',
      '--platform', 'managed',
      '--allow-unauthenticated'
    ]

serviceAccount: 'household-app@household-app-453607.iam.gserviceaccount.com'
logsBucket: 'gs://household-app-453607-logs'

substitutions:
  _FIREBASE_API_KEY: 'default_value_placeholder'
  _FIREBASE_AUTH_DOMAIN: 'default_value_placeholder'
  _FIREBASE_PROJECT_ID: 'default_value_placeholder'
  _FIREBASE_STORAGE_BUCKET: 'default_value_placeholder'
  _FIREBASE_MESSAGING_SENDER_ID: 'default_value_placeholder'
  _FIREBASE_APP_ID: 'default_value_placeholder'
  _FIREBASE_MEASUREMENT_ID: 'default_value_placeholder'

images:
  - 'asia-northeast1-docker.pkg.dev/${PROJECT_ID}/household-app-repo/household-app:${SHORT_SHA}'