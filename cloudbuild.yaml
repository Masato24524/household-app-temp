steps:
  # デバッグ用：リポジトリの内容表示
  # - name: 'ubuntu'
  #   args: ['bash', '-c', 'ls -la && echo "Check package-lock.json:" && ls -la package-lock.json || echo "package-lock.json not found"']
  
  # コンテナイメージのビルド(Cloud-build)
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      # '--build-arg', 'NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}',
      # '--build-arg', 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}',
      # '--build-arg', 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}',
      # '--build-arg', 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}',
      # '--build-arg', 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}',
      # '--build-arg', 'NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}',
      # '--build-arg', 'NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID=${_FIREBASE_MEASUREMENT_ID}',
      '-t', 'asia-northeast1-docker.pkg.dev/${PROJECT_ID}/household-app-repo/household-app:${SHORT_SHA}',
      '.'
    ]
    secretEnv:
      - FIREBASE_API_KEY
      - FIREBASE_AUTH_DOMAIN
      - FIREBASE_PROJECT_ID
      - FIREBASE_STORAGE_BUCKET
      - FIREBASE_MESSAGING_SENDER_ID
      - FIREBASE_APP_ID
      - FIREBASE_MEASUREMENT_ID

  # Artifact Registry にイメージをプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'asia-northeast1-docker.pkg.dev/${PROJECT_ID}/household-app-repo/household-app:${SHORT_SHA}']

  # Cloud Run にデプロイ
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'household-app',
      '--image', 'asia-northeast1-docker.pkg.dev/${PROJECT_ID}/household-app-repo/household-app:${SHORT_SHA}',
      '--region', 'asia-northeast1',
      '--platform', 'managed',
      '--allow-unauthenticated'
    ]

# SecretManagerから環境変数を取得
availableSecrets:
  secretManager:
  - versionName: projects/household-app-453607/secrets/FIREBASE_API_KEY/versions/latest
    env: 'FIREBASE_API_KEY'
  - versionName: projects/household-app-453607/secrets/FIREBASE_AUTH_DOMAIN/versions/latest
    env: 'FIREBASE_AUTH_DOMAIN'
  - versionName: projects/household-app-453607/secrets/FIREBASE_PROJECT_ID/versions/latest
    env: 'FIREBASE_PROJECT_ID'
  - versionName: projects/household-app-453607/secrets/FIREBASE_STORAGE_BUCKET/versions/latest
    env: 'FIREBASE_STORAGE_BUCKET'
  - versionName: projects/household-app-453607/secrets/FIREBASE_MESSAGING_SENDER_ID/versions/latest
    env: 'FIREBASE_MESSAGING_SENDER_ID'
  - versionName: projects/household-app-453607/secrets/FIREBASE_APP_ID/versions/latest
    env: 'FIREBASE_APP_ID'
  - versionName: projects/household-app-453607/secrets/FIREBASE_MEASUREMENT_ID/versions/latest
    env: 'FIREBASE_MEASUREMENT_ID'

# 取得したSecretをマッピング
substitutions:
    FIREBASE_API_KEY: projects/household-app-453607/secrets/FIREBASE_API_KEY/versions/latest
    FIREBASE_AUTH_DOMAIN: projects/household-app-453607/secrets/FIREBASE_AUTH_DOMAIN/versions/latest
    FIREBASE_PROJECT_ID: projects/household-app-453607/secrets/FIREBASE_PROJECT_ID/versions/latest
    FIREBASE_STORAGE_BUCKET: projects/household-app-453607/secrets/FIREBASE_STORAGE_BUCKET/versions/latest
    FIREBASE_MESSAGING_SENDER_ID: projects/household-app-453607/secrets/FIREBASE_MESSAGING_SENDER_ID/versions/latest
    FIREBASE_APP_ID: projects/household-app-453607/secrets/FIREBASE_APP_ID/versions/latest
    FIREBASE_MEASUREMENT_ID: projects/household-app-453607/secrets/FIREBASE_MEASUREMENT_ID/versions/latest

serviceAccount: 'household-app@household-app-453607.iam.gserviceaccount.com'
logsBucket: 'gs://household-app-453607-logs'

# substitutions:
#   _FIREBASE_API_KEY: 'default_value_placeholder'
#   _FIREBASE_AUTH_DOMAIN: 'default_value_placeholder'
#   _FIREBASE_PROJECT_ID: 'default_value_placeholder'
#   _FIREBASE_STORAGE_BUCKET: 'default_value_placeholder'
#   _FIREBASE_MESSAGING_SENDER_ID: 'default_value_placeholder'
#   _FIREBASE_APP_ID: 'default_value_placeholder'
#   _FIREBASE_MEASUREMENT_ID: 'default_value_placeholder'

images:
  - 'asia-northeast1-docker.pkg.dev/${PROJECT_ID}/household-app-repo/household-app:${SHORT_SHA}'